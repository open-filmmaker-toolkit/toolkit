<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 72" width="330" height="72" role="img" aria-label="Open Filmmaker Toolkit">
  <title>Open Filmmaker Toolkit</title>
  <!-- mark: a play button between code brackets, for films made with open tools -->
  <g transform="translate(4 10)">
    <rect x="1" y="1" width="50" height="50" rx="6" fill="#111111" stroke="#f2f2f2" stroke-width="2"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18.5 13 8.5 26l10 13"/><path d="M33.5 13l10 13-10 13"/><path d="M22.8 19.8v12.4L31.8 26z"/>
    </g>
  </g>
  <!-- wordmark -->
  <text x="72" y="34" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="20" letter-spacing="0.5" fill="#f2f2f2">OPEN FILMMAKER</text>
  <text x="72" y="57" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="20" letter-spacing="0.5" fill="#f2f2f2">TOOLKIT</text>
</svg>
