<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 72" width="330" height="72" role="img" aria-label="Open Filmmaker Toolkit">
  <title>Open Filmmaker Toolkit</title>
  <!-- icon: a strip of film whose middle frame is a fork, for open source -->
  <g transform="translate(4 10)">
    <rect x="1" y="1" width="50" height="50" rx="6" fill="#111111" stroke="#f2f2f2" stroke-width="2"/>
    <g fill="#ffffff">
      <rect x="4" y="5" width="5" height="6" rx="1.2"/><rect x="4" y="16" width="5" height="6" rx="1.2"/><rect x="4" y="27" width="5" height="6" rx="1.2"/><rect x="4" y="38" width="5" height="6" rx="1.2"/>
      <rect x="43" y="5" width="5" height="6" rx="1.2"/><rect x="43" y="16" width="5" height="6" rx="1.2"/><rect x="43" y="27" width="5" height="6" rx="1.2"/><rect x="43" y="38" width="5" height="6" rx="1.2"/>
    </g>
    <rect x="13" y="8" width="26" height="36" rx="3" fill="#2fd0e8"/>
    <g fill="none" stroke="#111111" stroke-width="3"><circle cx="20" cy="17" r="3"/><circle cx="20" cy="35" r="3"/><circle cx="32" cy="24" r="3"/><path d="M20 20V32M32 27C32 31 20 29 20 32"/></g>
  </g>
