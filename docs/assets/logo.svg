<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 72" width="330" height="72" role="img" aria-label="Open Filmmaker Toolkit">
  <title>Open Filmmaker Toolkit</title>
  <!-- icon: a strip of film whose middle frame is a checked clearance -->
  <g transform="translate(4 10)">
    <rect x="0" y="0" width="52" height="52" rx="6" fill="#111111"/>
    <g fill="#ffffff">
      <rect x="4" y="5" width="5" height="6" rx="1.2"/><rect x="4" y="16" width="5" height="6" rx="1.2"/><rect x="4" y="27" width="5" height="6" rx="1.2"/><rect x="4" y="38" width="5" height="6" rx="1.2"/>
      <rect x="43" y="5" width="5" height="6" rx="1.2"/><rect x="43" y="16" width="5" height="6" rx="1.2"/><rect x="43" y="27" width="5" height="6" rx="1.2"/><rect x="43" y="38" width="5" height="6" rx="1.2"/>
    </g>
    <rect x="13" y="8" width="26" height="36" rx="3" fill="#ffd400"/>
    <path d="M19 27 L24.5 33 L34 19" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- wordmark -->
  <text x="72" y="34" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="20" letter-spacing="0.5" fill="#111111">OPEN FILMMAKER</text>
  <text x="72" y="57" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="20" letter-spacing="0.5" fill="#111111">TOOLKIT</text>
</svg>
