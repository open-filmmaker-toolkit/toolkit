<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="One project file opens in the clearance log and the music cue sheet">
  <title>One project file, shared by every tool</title>
  <rect width="900" height="300" rx="14" fill="#f6f6f6"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- project file -->
    <rect x="30" y="70" width="190" height="160" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <rect x="30" y="70" width="190" height="30" rx="10" fill="#111111"/>
    <rect x="30" y="90" width="190" height="10" fill="#111111"/>
    <text x="125" y="91" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">the-river-keeps.oft.json</text>
    <g font-size="12" fill="#111111">
      <text x="48" y="128">people</text><text x="48" y="150">locations</text><text x="48" y="172">thirdPartyElements</text><text x="48" y="194">contracts</text><text x="48" y="216">assets</text>
    </g>
    <path d="M232 150 H292" stroke="#111111" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M292 150 L282 144 M292 150 L282 156" stroke="#111111" stroke-width="2" fill="none"/>
    <!-- clearance log -->
    <rect x="310" y="30" width="270" height="240" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="325" y="58" font-size="15" font-weight="800" fill="#111111">Clearance log</text>
    <g>
      <rect x="325" y="72" width="30" height="34" rx="3" fill="#2ea44f"/><rect x="361" y="72" width="30" height="34" rx="3" fill="#2ea44f"/>
      <rect x="397" y="72" width="30" height="34" rx="3" fill="#d29922"/><rect x="433" y="72" width="30" height="34" rx="3" fill="#2ea44f"/>
      <rect x="469" y="72" width="30" height="34" rx="3" fill="#8b949e"/><rect x="505" y="72" width="30" height="34" rx="3" fill="#cf222e"/>
    </g>
    <g font-size="12" fill="#111111">
      <text x="325" y="136">Flood of 1965, aerial</text><text x="500" y="136" text-anchor="end" fill="#2ea44f" font-weight="700">Licensed</text>
      <text x="325" y="162">Muddy Water Hymn</text><text x="500" y="162" text-anchor="end" fill="#9a6700" font-weight="700">Negotiating</text>
      <text x="325" y="188">Grain elevator mural</text><text x="500" y="188" text-anchor="end" fill="#6e7781" font-weight="700">Requested</text>
      <text x="325" y="214">Beer sign, bar scene</text><text x="500" y="214" text-anchor="end" fill="#cf222e" font-weight="700">Replace</text>
    </g>
    <text x="325" y="250" font-size="12" fill="#444444">Print a report for your E&amp;O attorney</text>
    <!-- cue sheet -->
    <rect x="600" y="30" width="270" height="240" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    <text x="615" y="58" font-size="15" font-weight="800" fill="#111111">Music cue sheet</text>
    <g font-size="12" fill="#111111">
      <text x="615" y="92" font-weight="700">1M1</text><text x="655" y="92">Main title</text><text x="855" y="92" text-anchor="end" fill="#2ea44f" font-weight="700">Ready</text>
      <text x="615" y="118" font-weight="700">1M3</text><text x="655" y="118">Levee at night</text><text x="855" y="118" text-anchor="end" fill="#2ea44f" font-weight="700">Ready</text>
      <text x="615" y="144" font-weight="700">1M5</text><text x="655" y="144">Muddy Water Hymn</text><text x="855" y="144" text-anchor="end" fill="#9a6700" font-weight="700">Needs info</text>
      <text x="615" y="170" font-weight="700">2M2</text><text x="655" y="170">River ambience</text><text x="855" y="170" text-anchor="end" fill="#9a6700" font-weight="700">Needs info</text>
    </g>
    <rect x="615" y="196" width="240" height="8" rx="4" fill="#e5e5e5"/>
    <rect x="615" y="196" width="120" height="8" rx="4" fill="#2fd0e8"/>
    <text x="615" y="250" font-size="12" fill="#444444">Delivery-ready sheet, music from the log</text>
    <path d="M580 150 H600" stroke="#111111" stroke-width="2"/>
  </g>
</svg>
