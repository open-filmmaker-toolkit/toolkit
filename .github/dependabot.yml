version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # The desktop app's Rust dependencies. Monthly, in one pull request, so it doesn't crowd the shared runners.
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
