name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sign-off:
    name: Every commit is signed off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check for a Signed-off-by line from each commit's author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git show -s --format='%ae' "$c")
            subject=$(git show -s --format='%s' "$c")
            if ! git show -s --format='%B' "$c" | grep -i '^Signed-off-by:' | grep -qiF "<$email>"; then
              echo "::error::Commit ${c:0:7} \"$subject\" isn't signed off by its author ($email)."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo
            echo "Each commit needs a Signed-off-by line matching its author's email."
            echo "To fix, run:  git rebase --signoff ${BASE:0:7}  then  git push --force-with-lease"
            echo "See CONTRIBUTING.md, 'Sign off your commits'."
            exit 1
          fi
          echo "Every commit is signed off."
