name: Real browsers

# Checks every tool in the Firefox and Safari that GitHub's runners already have,
# with nothing to download. Weekly, on demand, and on pull requests that change it.
on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - tests/real_browsers.py
      - .github/workflows/real-browsers.yml

permissions:
  contents: read

concurrency:
  group: real-browsers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-browser:
    name: Real browser (${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            os: ubuntu-latest
          - browser: safari
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Selenium
        timeout-minutes: 3
        run: python -m pip install --disable-pip-version-check "selenium==4.27.1"

      - name: Turn on Safari automation
        if: matrix.browser == 'safari'
        timeout-minutes: 2
        run: sudo safaridriver --enable

      - name: Check the tools
        timeout-minutes: 8
        run: python tests/real_browsers.py ${{ matrix.browser }}
