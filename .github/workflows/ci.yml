name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Schema, samples and tool rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.23.0"

      - name: Validate
        run: python .github/scripts/validate_repo.py

  browser:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Firefox and WebKit installs kept hanging on GitHub's runners. chromium-fallback
        # covers the download/upload save path those browsers use.
        browser: [chromium, chromium-fallback]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Playwright
        timeout-minutes: 6
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.64.1" "pypdf==5.9.0"
          python -m playwright install --with-deps chromium

      - name: Run browser tests
        run: python tests/browser_tools.py ${{ matrix.browser }}
